<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Rooms - e-Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand">e<span>Hotels</span></a>
        <a href="/employee/dashboard" class="topbar-link">Staff Login</a>
    </div>
</nav>

<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Search Available Rooms</h1>
        <p class="page-subtitle">Find and book rooms across all hotel chains</p>
    </div>

    <div class="card">
        <div class="card-header">Search Filters</div>
        <form action="/search/results" method="get" id="searchForm">
            <div class="form-grid form-grid-4 mb-3">
                <div class="form-group">
                    <label class="form-label">Start Date *</label>
                    <input type="date" name="startDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">End Date *</label>
                    <input type="date" name="endDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Area</label>
                    <select name="area" class="form-select search-filter">
                        <option value="">All Areas</option>
                        <option th:each="a : ${areas}" th:value="${a}" th:text="${a}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Hotel Chain</label>
                    <select name="chainId" class="form-select search-filter">
                        <option value="">All Chains</option>
                        <option th:each="c : ${chains}" th:value="${c.chainId}" th:text="${c.name}"></option>
                    </select>
                </div>
            </div>
            <div class="form-grid form-grid-4 mb-3">
                <div class="form-group">
                    <label class="form-label">Star Rating</label>
                    <select name="category" class="form-select search-filter">
                        <option value="">Any</option>
                        <option value="1">1 Star</option>
                        <option value="2">2 Stars</option>
                        <option value="3">3 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="5">5 Stars</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Capacity</label>
                    <select name="capacity" class="form-select search-filter">
                        <option value="">Any</option>
                        <option value="single">Single</option>
                        <option value="double">Double</option>
                        <option value="triple">Triple</option>
                        <option value="quad">Quad</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Hotel Total Rooms</label>
                    <input type="number" name="totalRooms" class="form-control search-filter" min="1" placeholder="Any">
                </div>
                <div class="form-group">
                    <label class="form-label">Min Price ($)</label>
                    <input type="number" name="minPrice" class="form-control search-filter" step="0.01" placeholder="0">
                </div>
            </div>
            <div class="form-grid form-grid-4">
                <div class="form-group">
                    <label class="form-label">Max Price ($)</label>
                    <input type="number" name="maxPrice" class="form-control search-filter" step="0.01" placeholder="999">
                </div>
                <div class="form-group"></div>
                <div class="form-group"></div>
                <div class="form-group form-group--end">
                    <button type="submit" class="btn btn-primary btn-full">Search Rooms</button>
                </div>
            </div>
        </form>
    </div>

    <div class="card" th:if="${!rooms.isEmpty()}">
        <div class="card-title-count" th:text="'Results - ' + ${rooms.size()} + ' rooms found'"></div>
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Room ID</th>
                        <th>Room #</th>
                        <th>Capacity</th>
                        <th>Price / Night</th>
                        <th>View</th>
                        <th>Extendable</th>
                        <th>Problems</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="room : ${rooms}">
                        <td th:text="${room.roomId}"></td>
                        <td><strong th:text="${room.roomNumber}"></strong></td>
                        <td><span class="tag tag--green" th:text="${room.capacity}"></span></td>
                        <td><strong th:text="'$' + ${room.price}"></strong></td>
                        <td th:text="${room.viewType} ?: 'N/A'"></td>
                        <td th:text="${room.extendable} ? 'Yes' : 'No'"></td>
                        <td th:text="${room.problems} ?: '-'"></td>
                        <td><a th:href="@{/bookings/new(roomId=${room.roomId})}" class="btn btn-primary btn-sm">Book</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${rooms.isEmpty()}" class="empty-state">
        <p>No rooms found. Select dates and adjust your filters to search.</p>
    </div>
</div>

<script>
document.querySelectorAll('.search-filter').forEach((input) => {
    input.addEventListener('change', () => {
        const form = document.getElementById('searchForm');
        if (form.startDate.value && form.endDate.value) {
            form.requestSubmit();
        }
    });
});
</script>
</body>
</html>

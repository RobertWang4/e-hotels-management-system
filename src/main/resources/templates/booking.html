<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Booking - e-Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand">e<span>Hotels</span></a>
        <a href="/employee/dashboard" class="topbar-link">Staff Login</a>
    </div>
</nav>

<div class="page-container page-container--narrow">
    <div class="page-header">
        <h1 class="page-title">Create Booking</h1>
        <p class="page-subtitle">Confirm your reservation details</p>
    </div>

    <div class="room-details">
        <div class="room-detail-item">
            <div class="room-detail-label">Room Number</div>
            <div class="room-detail-value" th:text="${room.roomNumber}"></div>
        </div>
        <div class="room-detail-item">
            <div class="room-detail-label">Capacity</div>
            <div class="room-detail-value" th:text="${room.capacity}"></div>
        </div>
        <div class="room-detail-item">
            <div class="room-detail-label">Price / Night</div>
            <div class="room-detail-value" th:text="'$' + ${room.price}"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Booking Information</div>
        <form action="/bookings" method="post">
            <input type="hidden" name="roomId" th:value="${room.roomId}">
            <div class="form-group mb-3">
                <label class="form-label">Customer</label>
                <select name="customerId" class="form-select" required>
                    <option value="">Select a customer</option>
                    <option th:each="c : ${customers}" th:value="${c.customerId}" th:text="${c.fullName + ' (' + c.idType + ': ' + c.idNumber + ')'}"></option>
                </select>
            </div>
            <div class="form-grid form-grid-2 mb-4">
                <div class="form-group">
                    <label class="form-label">Check-in Date</label>
                    <input type="date" name="startDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Check-out Date</label>
                    <input type="date" name="endDate" class="form-control" required>
                </div>
            </div>
            <div style="display:flex;gap:0.75rem;">
                <button type="submit" class="btn btn-primary">Confirm Booking</button>
                <a href="/search" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

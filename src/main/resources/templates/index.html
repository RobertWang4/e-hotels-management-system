<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand">e<span>Hotels</span></a>
        <a href="/employee/dashboard" class="topbar-link">Staff Login</a>
    </div>
</nav>

<div class="landing">
    <div class="landing-inner">
        <h1 class="landing-title">Welcome to eHotels</h1>
        <p class="landing-subtitle">Search and book rooms across 5 major chains and 40+ hotels in Canada. Staff can manage operations from the dashboard.</p>
        <div class="landing-cards">
            <a href="/search" class="landing-card">
                <div class="landing-card-icon landing-card-icon--guest">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
                <div class="landing-card-title">Guest</div>
                <div class="landing-card-desc">Search available rooms, compare prices, and book your stay</div>
            </a>
            <a href="/employee/dashboard" class="landing-card">
                <div class="landing-card-icon landing-card-icon--staff">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M13 8h4"/><path d="M13 12h4"/><path d="M13 16h4"/></svg>
                </div>
                <div class="landing-card-title">Staff</div>
                <div class="landing-card-desc">Check-in guests, manage rentals, and handle administration</div>
            </a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee - e-Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<div class="staff-layout">
    <aside class="sidebar">
        <a href="../index.html" th:href="@{/}" class="sidebar-brand">e<span>Hotels</span></a>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Operations</div>
            <a href="../employee-dashboard.html" th:href="@{/employee/dashboard}" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                Dashboard
            </a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Administration</div>
            <a href="customers.html" th:href="@{/admin/customers}" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Customers
            </a>
            <a href="employees.html" th:href="@{/admin/employees}" class="sidebar-link active">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><rect width="4" height="5" x="18" y="8" rx="1"/></svg>
                Employees
            </a>
            <a href="hotels.html" th:href="@{/admin/hotels}" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Z"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
                Hotels
            </a>
            <a href="rooms.html" th:href="@{/admin/rooms}" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M2 20h20"/></svg>
                Rooms
            </a>
        </div>
    </aside>

    <main class="staff-main">
        <div class="staff-topbar">
            <span class="staff-topbar-title">Administration / Employees / Edit</span>
        </div>
        <div class="staff-content">
            <div class="page-header">
                <h1 class="page-title">Edit Employee</h1>
            </div>

            <div th:if="${message}" class="alert alert--success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert--error" th:text="${error}"></div>

            <div class="card">
                <div class="card-header">Update Employee Details</div>
                <form th:action="@{/admin/employees/edit/{id}(id=${employee.employeeId})}" method="post">
                    <div class="form-grid form-grid-5">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="fullName" th:value="${employee.fullName}" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" th:value="${employee.address}" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">SSN/SIN</label>
                            <input type="text" name="ssnSin" th:value="${employee.ssnSin}" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Hotel</label>
                            <select name="hotelId" class="form-select" required>
                                <option th:each="h : ${hotels}" th:value="${h.hotelId}" th:text="${h.name}" th:selected="${employee.hotelId == h.hotelId}"></option>
                            </select>
                            <p class="form-help">Moving the current manager will automatically reassign the old hotel's manager when possible.</p>
                        </div>
                        <div class="form-group form-group--end">
                            <button class="btn btn-primary btn-full">Save Changes</button>
                        </div>
                    </div>
                </form>
            </div>
            <a href="employees.html" th:href="@{/admin/employees}" class="btn btn-secondary">Back to Employees</a>
        </div>
    </main>
</div>
</body>
</html>

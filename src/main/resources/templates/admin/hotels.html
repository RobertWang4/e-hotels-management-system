<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Hotels - e-Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="staff-layout">
    <aside class="sidebar">
        <a href="/" class="sidebar-brand">e<span>Hotels</span></a>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Operations</div>
            <a href="/employee/dashboard" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                Dashboard
            </a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Administration</div>
            <a href="/admin/customers" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Customers
            </a>
            <a href="/admin/employees" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><rect width="4" height="5" x="18" y="8" rx="1"/></svg>
                Employees
            </a>
            <a href="/admin/hotels" class="sidebar-link active">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2Z"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
                Hotels
            </a>
            <a href="/admin/rooms" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M2 20h20"/></svg>
                Rooms
            </a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Views</div>
            <a href="/views/available-rooms" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
                Available Rooms
            </a>
            <a href="/views/hotel-capacity" class="sidebar-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect width="4" height="7" x="7" y="10" rx="1"/><rect width="4" height="12" x="15" y="5" rx="1"/></svg>
                Hotel Capacity
            </a>
        </div>
    </aside>

    <main class="staff-main">
        <div class="staff-topbar">
            <span class="staff-topbar-title">Administration / Hotels</span>
        </div>
        <div class="staff-content">
            <div class="page-header">
                <h1 class="page-title">Hotels</h1>
            </div>

            <div class="card">
                <div class="card-header">Add New Hotel</div>
                <form action="/admin/hotels" method="post">
                    <div class="form-grid form-grid-4 mb-3">
                        <div class="form-group">
                            <label class="form-label">Hotel Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Chain</label>
                            <select name="chainId" class="form-select" required>
                                <option th:each="c : ${chains}" th:value="${c.chainId}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Stars</label>
                            <select name="category" class="form-select" required>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                                <option value="4">4</option><option value="5">5</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-grid form-grid-4">
                        <div class="form-group">
                            <label class="form-label">Area</label>
                            <input type="text" name="area" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" name="contactEmail" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="text" name="contactPhone" class="form-control" required>
                        </div>
                        <div class="form-group form-group--end">
                            <button class="btn btn-primary btn-full">Add Hotel</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-title-count" th:text="'Hotels (' + ${hotels.size()} + ')'"></div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Name</th><th>Chain</th><th>Stars</th><th>Area</th><th>Address</th><th>Email</th><th></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="h : ${hotels}">
                                <td th:text="${h.hotelId}"></td>
                                <td><strong th:text="${h.name}"></strong></td>
                                <td th:text="${h.chainId}"></td>
                                <td th:text="${h.category}"></td>
                                <td><span class="tag tag--blue" th:text="${h.area}"></span></td>
                                <td th:text="${h.address}"></td>
                                <td th:text="${h.contactEmail}"></td>
                                <td>
                                    <a th:href="@{/admin/hotels/edit/{id}(id=${h.hotelId})}" class="btn btn-primary" style="margin-right: 5px;">Edit</a>
                                    <form action="/admin/hotels/delete" method="post" class="d-inline">
                                        <input type="hidden" name="hotelId" th:value="${h.hotelId}">
                                        <button class="btn btn-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>

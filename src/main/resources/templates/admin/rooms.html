<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms - e-Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="staff-layout">
    <aside class="sidebar">
        <a href="/" class="sidebar-brand">e<span>Hotels</span></a>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Operations</div>
            <a href="/employee/dashboard" class="sidebar-link">Dashboard</a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Administration</div>
            <a href="/admin/customers" class="sidebar-link">Customers</a>
            <a href="/admin/employees" class="sidebar-link">Employees</a>
            <a href="/admin/hotels" class="sidebar-link">Hotels</a>
            <a href="/admin/rooms" class="sidebar-link active">Rooms</a>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <div class="sidebar-section-label">Views</div>
            <a href="/views/available-rooms" class="sidebar-link">Available Rooms</a>
            <a href="/views/hotel-capacity" class="sidebar-link">Hotel Capacity</a>
        </div>
    </aside>

    <main class="staff-main">
        <div class="staff-topbar">
            <span class="staff-topbar-title">Administration / Rooms</span>
        </div>
        <div class="staff-content">
            <div class="page-header">
                <h1 class="page-title">Rooms</h1>
            </div>

            <div class="card">
                <div class="card-header">Add New Room</div>
                <form action="/admin/rooms" method="post">
                    <div class="form-grid form-grid-4 mb-3">
                        <div class="form-group">
                            <label class="form-label">Hotel</label>
                            <select name="hotelId" class="form-select" required>
                                <option th:each="h : ${hotels}" th:value="${h.hotelId}" th:text="${h.name}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Room #</label>
                            <input type="text" name="roomNumber" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Capacity</label>
                            <select name="capacity" class="form-select" required>
                                <option value="single">Single</option>
                                <option value="double">Double</option>
                                <option value="triple">Triple</option>
                                <option value="quad">Quad</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Price ($)</label>
                            <input type="number" name="price" class="form-control" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-grid form-grid-4">
                        <div class="form-group">
                            <label class="form-label">View</label>
                            <select name="viewType" class="form-select">
                                <option value="">None</option>
                                <option value="city">City</option>
                                <option value="sea">Sea</option>
                                <option value="mountain">Mountain</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Problems</label>
                            <input type="text" name="problems" class="form-control" placeholder="Optional notes">
                        </div>
                        <div class="form-group form-group--end">
                            <div class="form-check">
                                <input type="checkbox" name="extendable" value="true" class="form-check-input">
                                <label class="form-check-label">Extendable</label>
                            </div>
                        </div>
                        <div class="form-group form-group--end">
                            <button class="btn btn-primary btn-full">Add Room</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card">
                <div class="card-title-count" th:text="'Rooms (' + ${rooms.size()} + ')'"></div>
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                            <tr><th>ID</th><th>Hotel</th><th>Room #</th><th>Capacity</th><th>Price</th><th>View</th><th>Ext.</th><th>Problems</th><th></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${rooms}">
                                <td th:text="${r.roomId}"></td>
                                <td th:text="${r.hotelId}"></td>
                                <td><strong th:text="${r.roomNumber}"></strong></td>
                                <td><span class="tag tag--green" th:text="${r.capacity}"></span></td>
                                <td><strong th:text="'$' + ${r.price}"></strong></td>
                                <td th:text="${r.viewType} ?: '-'"></td>
                                <td th:text="${r.extendable} ? 'Yes' : 'No'"></td>
                                <td th:text="${r.problems} ?: '-'"></td>
                                <td>
                                    <a th:href="@{/admin/rooms/edit/{id}(id=${r.roomId})}" class="btn btn-primary" style="margin-right: 5px;">Edit</a>
                                    <form action="/admin/rooms/delete" method="post" class="d-inline">
                                        <input type="hidden" name="roomId" th:value="${r.roomId}">
                                        <button class="btn btn-danger">Delete</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>

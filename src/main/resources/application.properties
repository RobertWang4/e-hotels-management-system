spring.datasource.url=jdbc:postgresql://localhost:5432/ehotels
spring.datasource.username=robert
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:sql/triggers.sql,classpath:sql/views.sql,classpath:sql/indexes.sql
spring.sql.init.data-locations=classpath:data.sql
spring.cache.type=simple

app.cache.redis-enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
